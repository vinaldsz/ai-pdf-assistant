[project]
name = "ai-pdf-assistant"
version = "0.1.0"
description = "Production-ready RAG service for PDF question answering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vinal Dsouza" }]

# Runtime deps grow per Day in plan.md. Day 1 only needs settings.
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.138.0",
    "groq>=1.4.0",
    "httpx>=0.27,<1",
    "langchain-openai>=1.3.3",
    "langfuse>=4.9.1",
    "pgvector>=0.3,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "pypdf>=4.0,<5",
    "python-dotenv>=1.0,<2",
    "ragas>=0.4.3",
    "sentence-transformers>=3.0,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
]
ui = [
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that load ML models (~90 MB download on first run); deselect with -m 'not slow'",
    "e2e: marks end-to-end tests that require a running API (set E2E_API_URL env var)",
]
