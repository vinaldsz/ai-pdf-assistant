[project]
name = "ai-pdf-assistant"
version = "0.1.0"
description = "Production-ready RAG service for PDF question answering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vinal Dsouza" }]

# Runtime deps grow per Day in plan.md. Day 1 only needs settings.
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "boto3>=1.35,<2",
    "fastapi>=0.138.0",
    "httpx>=0.27,<1",
    "langfuse>=4.9.1",
    "openai>=2.43.0",
    "pgvector>=0.3,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.14.2,<3",
    "pypdf>=6.13.3,<7",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3.0,<4",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pgvector", "pgvector.*", "sentence_transformers", "sentence_transformers.*", "langfuse", "langfuse.*", "slowapi", "slowapi.*", "ragas", "ragas.*", "datasets", "datasets.*", "testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that load ML models (~90 MB download on first run); deselect with -m 'not slow'",
    "e2e: marks end-to-end tests that require a running API (set E2E_API_URL env var)",
    "integration: marks tests that require Docker (real pgvector DB via testcontainers)",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ragas>=0.4.3",
    "ruff>=0.6",
    "testcontainers>=4.14.2",
]
