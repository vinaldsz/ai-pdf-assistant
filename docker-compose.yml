services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: [deploy]   # excluded from default `docker compose up` — build only for deployment
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL — in compose the DB host is "db", not localhost.
      DATABASE_URL: postgresql://ai:ai@db:5432/ai
    volumes:
      # Persist the bge-small model across restarts (~90 MB download on first run).
      - model_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s   # allow time for migrations + model warmup

volumes:
  pgdata:
  model_cache:
